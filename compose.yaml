# Dev stack: hot reload + bind mounts. First run: docker compose up --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: backend/.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      WIKI_ROOT: /data/teacher_wiki
      BETA_ENABLED: ${BETA_ENABLED:-false}
      BETA_DATA_ROOT: /data/beta_data
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}"]'
    volumes:
      - ./backend/app:/app/app
      - ${WIKI_HOST_DIR:-./backend/teacher_wiki}:/data/teacher_wiki
      - ${BETA_DATA_HOST_DIR:-./backend/beta_data}:/data/beta_data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      INTERNAL_API_BASE_URL: http://backend:8010
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8010}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
