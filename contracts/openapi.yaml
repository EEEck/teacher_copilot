openapi: 3.1.0
info:
  title: KlassenPilot API
  version: 0.1.0
paths:
  /api/health:
    get:
      summary: Health check
  /api/classes:
    get:
      summary: List classes
      responses:
        '200':
          description: Classes in the workspace
    post:
      summary: Create a class from a reviewed curriculum route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassRequest'
      responses:
        '201':
          description: Class created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSummary'
        '422':
          description: The request or requested class failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/classes/curriculum-routes:
    get:
      summary: List reviewed curriculum routes
      responses:
        '200':
          description: Reviewed routes available for class creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumRoutesResponse'
  /api/classes/{classId}/timeline:
    get:
      summary: Lesson timeline
  /api/classes/{classId}/snapshot:
    get:
      summary: Class memory snapshot
  /api/classes/{classId}/ingest/sessions:
    post:
      summary: Start ingest chat session
  /api/classes/{classId}/ingest/sessions/{sessionId}/chat:
    post:
      summary: Chat turn
  /api/classes/{classId}/ingest/sessions/{sessionId}/propose:
    post:
      summary: Generate diary MD and wiki proposals
  /api/classes/{classId}/ingest/commit:
    post:
      summary: Commit approved diary and wiki updates
  /api/classes/{classId}/plan-lesson:
    post:
      summary: Generate lesson plan
components:
  schemas:
    CurriculumRouteOption:
      type: object
      required: [subject, grade, branch]
      properties:
        subject:
          type: string
          enum: [chemie]
        grade:
          type: integer
          enum: [8, 9]
        branch:
          type: string
          enum: [NTG]
    CurriculumRoutesResponse:
      type: object
      required: [routes]
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/CurriculumRouteOption'
    CreateClassRequest:
      type: object
      required: [label, subject, grade]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        subject:
          type: string
          minLength: 1
          maxLength: 40
          enum: [chemie]
        grade:
          type: integer
          minimum: 1
          maximum: 13
          enum: [8, 9]
        section:
          type: string
          maxLength: 1
          default: ''
        school_year:
          type: string
          maxLength: 20
          default: ''
        branch:
          type: string
          maxLength: 20
          default: NTG
        school_type:
          type: string
          maxLength: 80
          default: Gymnasium
        state:
          type: string
          maxLength: 20
          default: BY
        prior_learning:
          type: string
          maxLength: 4000
          default: ''
        student_names:
          type: array
          maxItems: 999
          items:
            type: string
            minLength: 1
            maxLength: 120
            pattern: '^[^|\r\n]+$'
          default: []
    ErrorBody:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
        message:
          type: string
        detail:
          type: [string, 'null']
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ClassSummary:
      type: object
      required: [id, label, subject]
      properties:
        id:
          type: string
        label:
          type: string
        subject:
          type: string
          enum: [chemie]
