[project]
name = "klassenpilot-backend"
version = "0.1.0"
description = "KlassenPilot teacher copilot backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.55.0",
    "openai-agents>=0.0.14",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "rapidfuzz>=3.9.0",
    "mistralai>=1.5.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0", "deepeval>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
