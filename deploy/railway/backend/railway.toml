# Railway config-as-code for the backend service.
# In the Railway project, set Root Directory to the repo root (.).
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/backend/Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
numReplicas = 1
