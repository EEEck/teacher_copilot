components:
  parameters:
    ClassId:
      name: classId
      in: path
      required: true
      schema:
        type: string
      description: Stable class identifier.
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
      description: Durable structured course-network workflow draft identifier.
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
      description: Stable trusted-source identifier authorized for the class route.
    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
      description: Exact trusted-source section identifier.
  responses:
    NotFoundError:
      description: Class, course-network draft, or authorized evidence was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: Draft is terminal, adoption is in progress, or review/artifact snapshot is stale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request or structured draft validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    CurriculumRouteOption:
      type: object
      required:
      - subject
      - grade
      - branch
      properties:
        subject:
          type: string
          enum:
          - chemie
        grade:
          type: integer
          enum:
          - 8
          - 9
        branch:
          type: string
          enum:
          - NTG
    CurriculumRoutesResponse:
      type: object
      required:
      - routes
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/CurriculumRouteOption'
    CreateClassRequest:
      type: object
      required:
      - label
      - subject
      - grade
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        subject:
          type: string
          minLength: 1
          maxLength: 40
          enum:
          - chemie
        grade:
          type: integer
          minimum: 1
          maximum: 13
          enum:
          - 8
          - 9
        section:
          type: string
          maxLength: 1
          default: ''
        school_year:
          type: string
          maxLength: 20
          default: ''
        branch:
          type: string
          maxLength: 20
          default: NTG
        school_type:
          type: string
          maxLength: 80
          default: Gymnasium
        state:
          type: string
          maxLength: 20
          default: BY
        prior_learning:
          type: string
          maxLength: 4000
          default: ''
        student_names:
          type: array
          maxItems: 999
          items:
            type: string
            minLength: 1
            maxLength: 120
            pattern: ^[^|\r\n]+$
          default: []
    ErrorBody:
      properties:
        type:
          type: string
          title: Type
        message:
          type: string
          title: Message
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      type: object
      required:
      - type
      - message
      title: ErrorBody
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorEnvelope
    CourseNetworkResponse:
      properties:
        class_id:
          type: string
          title: Class Id
        network:
          anyOf:
          - $ref: '#/components/schemas/CourseNetworkDocument'
          - type: 'null'
      type: object
      required:
      - class_id
      title: CourseNetworkResponse
    CourseNetworkRoute:
      type: object
      required:
      - subject
      - grade
      - branch
      properties:
        subject:
          type: string
          enum:
          - chemie
        grade:
          type: integer
          enum:
          - 8
          - 9
        branch:
          type: string
          enum:
          - NTG
    CurriculumReference:
      properties:
        source_id:
          type: string
          title: Source Id
        section_id:
          type: string
          title: Section Id
      type: object
      required:
      - source_id
      - section_id
      title: CurriculumReference
    CourseNetworkSourceProvenance:
      properties:
        authority:
          type: string
          title: Authority
        jurisdiction:
          type: string
          title: Jurisdiction
        canonical_url:
          type: string
          title: Canonical Url
        retrieved_at:
          type: string
          title: Retrieved At
        version_label:
          type: string
          title: Version Label
        content_hash:
          type: string
          title: Content Hash
      type: object
      required:
      - authority
      - jurisdiction
      - canonical_url
      - retrieved_at
      - version_label
      - content_hash
      title: CourseNetworkSourceProvenance
    CourseNetworkSourceSectionResponse:
      properties:
        source_id:
          type: string
          title: Source Id
        source_title:
          type: string
          title: Source Title
        section_id:
          type: string
          title: Section Id
        section_title:
          type: string
          title: Section Title
        content:
          type: string
          title: Content
        provenance:
          $ref: '#/components/schemas/CourseNetworkSourceProvenance'
      type: object
      required:
      - source_id
      - source_title
      - section_id
      - section_title
      - content
      - provenance
      title: CourseNetworkSourceSectionResponse
    MaterialSectionReference:
      properties:
        material_id:
          type: string
          title: Material Id
        section_id:
          type: string
          title: Section Id
        page_start:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Page Start
        page_end:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Page End
      type: object
      required:
      - material_id
      - section_id
      title: MaterialSectionReference
    LearningBlock:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
          default: ''
        learning_goal:
          type: string
          title: Learning Goal
          default: ''
        curriculum_refs:
          items:
            $ref: '#/components/schemas/CurriculumReference'
          type: array
          title: Curriculum Refs
        material_refs:
          items:
            $ref: '#/components/schemas/MaterialSectionReference'
          type: array
          title: Material Refs
        origin:
          type: string
          enum:
          - curriculum
          - teacher
          - material
          title: Origin
          default: teacher
        status:
          type: string
          enum:
          - proposed
          - adopted
          - retired
          title: Status
          default: adopted
      type: object
      required:
      - id
      - title
      title: LearningBlock
      description: One teacher-facing Lernbaustein in a class course network.
    NetworkEdge:
      properties:
        id:
          type: string
          title: Id
        source_id:
          type: string
          title: Source Id
        target_id:
          type: string
          title: Target Id
        relation:
          type: string
          enum:
          - builds_on
          - related_to
          title: Relation
        curriculum_refs:
          items:
            $ref: '#/components/schemas/CurriculumReference'
          type: array
          title: Curriculum Refs
        material_refs:
          items:
            $ref: '#/components/schemas/MaterialSectionReference'
          type: array
          title: Material Refs
        origin:
          type: string
          enum:
          - curriculum
          - teacher
          - material
          title: Origin
          default: teacher
      type: object
      required:
      - id
      - source_id
      - target_id
      - relation
      title: NetworkEdge
    MaterialMapping:
      properties:
        id:
          type: string
          title: Id
        material_id:
          type: string
          title: Material Id
        section_id:
          type: string
          title: Section Id
        node_id:
          type: string
          title: Node Id
        relation:
          type: string
          enum:
          - explains
          - practices
          - assesses
          - extends
          title: Relation
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
        teacher_note:
          type: string
          title: Teacher Note
          default: ''
        origin:
          type: string
          enum:
          - agent
          - teacher
          title: Origin
      type: object
      required:
      - id
      - material_id
      - section_id
      - node_id
      - relation
      - origin
      title: MaterialMapping
    CanvasPosition:
      properties:
        x:
          type: number
          title: X
        y:
          type: number
          title: Y
      type: object
      required:
      - x
      - y
      title: CanvasPosition
    CourseNetworkDocument:
      properties:
        schema_version:
          type: integer
          const: 1
          title: Schema Version
          default: 1
        class_id:
          type: string
          title: Class Id
        route:
          $ref: '#/components/schemas/CurriculumRouteRef'
        revision:
          type: integer
          minimum: 1.0
          title: Revision
          default: 1
        nodes:
          items:
            $ref: '#/components/schemas/LearningBlock'
          type: array
          title: Nodes
        edges:
          items:
            $ref: '#/components/schemas/NetworkEdge'
          type: array
          title: Edges
        material_mappings:
          items:
            $ref: '#/components/schemas/MaterialMapping'
          type: array
          title: Material Mappings
        positions:
          additionalProperties:
            $ref: '#/components/schemas/CanvasPosition'
          type: object
          title: Positions
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - class_id
      - route
      - updated_at
      title: CourseNetworkDocument
      description: 'Canonical course-network data for one class.


        ``for_draft_seed`` is the sole construction path that permits proposed

        nodes. Ordinary construction represents a canonical document and rejects

        them before any durable write can occur.'
    CourseNetworkDraftDocument:
      properties:
        schema_version:
          type: integer
          const: 1
          title: Schema Version
        class_id:
          type: string
          title: Class Id
        route:
          $ref: '#/components/schemas/CurriculumRouteRef'
        revision:
          type: integer
          minimum: 0.0
          title: Revision
        nodes:
          items:
            $ref: '#/components/schemas/LearningBlock'
          type: array
          title: Nodes
        edges:
          items:
            $ref: '#/components/schemas/NetworkEdge'
          type: array
          title: Edges
        material_mappings:
          items:
            $ref: '#/components/schemas/MaterialMapping'
          type: array
          title: Material Mappings
        positions:
          additionalProperties:
            $ref: '#/components/schemas/CanvasPosition'
          type: object
          title: Positions
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - schema_version
      - class_id
      - route
